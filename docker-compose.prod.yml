services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.cpu
    env_file:
      - .env
    environment:
      - EMBEDDING_DEVICE=cpu
      - RERANKER_DEVICE=cpu
    volumes:
      - ./backend/documents:/app/backend/documents
      - ./backend/vectorstore:/app/backend/vectorstore
      - ./backend/feedback.jsonl:/app/backend/feedback.jsonl
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  hf_cache:
  caddy_data:
  caddy_config:
